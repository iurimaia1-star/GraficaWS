<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão da Gráfica – Orçamentos e Produção</title>
<style>
:root{
  --navy:#0f2a4a; --navy2:#16365e; --accent:#2563eb; --accent-d:#1d4ed8;
  --bg:#f2f5fa; --card:#fff; --line:#e3e8f0; --text:#1e293b; --muted:#64748b;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --violet:#7c3aed;
  --radius:12px; --shadow:0 1px 2px rgba(15,42,74,.06),0 4px 14px rgba(15,42,74,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
.sidebar{width:248px;background:var(--navy);color:#cfe0f5;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;color:#fff;font-weight:700;font-size:16px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);display:grid;place-items:center;overflow:hidden;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:contain}
.brand .logo.has-img{width:68px;height:42px;background:none;border-radius:0}
.brand small{display:block;font-weight:400;color:#8fb0d8;font-size:12px}
.nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:9px;color:#cfe0f5;text-decoration:none;cursor:pointer;font-weight:500}
.nav a:hover{background:var(--navy2)}
.nav a.active{background:var(--accent);color:#fff}
.nav a .badge{margin-left:auto;background:#ffffff26;border-radius:20px;padding:1px 8px;font-size:12px}
.nav a.active .badge{background:#ffffff40}
.nav hr{border:0;border-top:1px solid #ffffff1a;margin:8px 4px}
.side-foot{padding:12px 18px;font-size:12px;color:#7d9cc4}
.main{flex:1;margin-left:248px;min-width:0}
.topbar{display:none;align-items:center;gap:12px;padding:10px 14px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:30}
.topbar button{background:none;border:0;color:#fff;padding:6px;cursor:pointer}
.scrim{display:none}
.content{padding:24px;max-width:1280px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:16px;margin:0 0 12px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin-bottom:18px}
.kpi{cursor:pointer;display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--accent);transition:transform .1s}
.kpi:hover{transform:translateY(-2px)}
.kpi .n{font-size:30px;font-weight:700;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px}
.two{grid-template-columns:1fr 1fr}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{background:#f5f8fc}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 9px;min-height:32px;font-size:13px}
.btn.icon{padding:6px;min-height:32px;width:34px}
.btn svg,.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select{min-width:0}
input,select,textarea{border:1px solid #cdd6e3;border-radius:9px;padding:9px 11px;background:#fff;width:100%;min-height:40px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid #bfd3ff;border-color:var(--accent)}
input.invalid,select.invalid,textarea.invalid{border-color:var(--bad);background:#fff6f6}
input[disabled],select[disabled]{background:#f1f4f9;color:#94a3b8}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.fields .wide{grid-column:1/-1}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{background:#f7f9fc;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr.cat td{background:#eef3fb;font-weight:700;color:var(--navy);font-size:13px}
td.num,th.num{text-align:right;white-space:nowrap}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.pendente{background:#fef3c7;color:#92400e}
.pill.aprovado{background:#dcfce7;color:#166534}
.pill.recusado{background:#fee2e2;color:#991b1b}
.pill.expirado{background:#e2e8f0;color:#475569}
.pill.late{background:#fee2e2;color:#991b1b}
.pill.near{background:#fef3c7;color:#92400e}
.pill.fine{background:#e0ecff;color:#1e40af}
.empty{padding:30px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
/* quote form */
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:minmax(220px,3fr) 1fr 1fr .8fr 1.2fr 1.2fr auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fbfcfe}
.item .val{min-height:40px;display:flex;align-items:center;font-weight:700;white-space:nowrap}
.item .hint{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:-2px}
.item .hint.err{color:var(--bad);font-weight:600}
.item .hint b{color:var(--text)}
.summary{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 -4px 18px rgba(15,42,74,.1);padding:14px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-top:16px;z-index:5}
.summary .tot{font-size:26px;font-weight:800;color:var(--navy)}
.errbox{background:#fff1f1;border:1px solid #f5b5b5;color:#8a1c1c;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.errbox ul{margin:6px 0 0 18px;padding:0}
/* kanban */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:start}
.col{background:#e9eef6;border-radius:var(--radius);padding:10px;min-height:120px}
.col h3{margin:2px 4px 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.col h3 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.col h3 span{margin-left:auto;background:#fff;border-radius:20px;padding:0 9px;font-size:12px}
.ocard{background:#fff;border-radius:10px;border:1px solid var(--line);border-left:5px solid #94a3b8;padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.ocard.late{border-left-color:var(--bad);background:#fffafa}
.ocard.near{border-left-color:var(--warn);background:#fffdf6}
.ocard .top{display:flex;justify-content:space-between;gap:6px;align-items:center}
.ocard .num{font-weight:800;color:var(--navy)}
.ocard .cli{font-weight:600;margin:3px 0}
.ocard .meta{font-size:13px;color:var(--muted);display:grid;gap:2px;margin:6px 0 8px}
.ocard select{min-height:34px;padding:5px 8px;font-size:14px}
.ocard .actions{margin-top:8px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:100}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:780px}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h2{margin:0;font-size:18px}
.modal .body{padding:18px 20px}
.modal footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:#fafbfd;border-radius:0 0 14px 14px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px;margin-bottom:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:300}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:340px;animation:in .2s}
.toast.err{background:var(--bad)} .toast.ok{background:var(--ok)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.warnbar{background:#fff7e0;border:1px solid #f1d78b;color:#7a5200;border-radius:10px;padding:10px 14px;margin-bottom:14px}
.logo-prev{width:110px;height:70px;border:1px dashed #b8c4d6;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:#fff}
.logo-prev img{max-width:100%;max-height:100%}
/* document overlay */
#docOverlay{display:none;position:fixed;inset:0;background:#475569;z-index:200;overflow:auto}
#docOverlay.open{display:block}
.doc-bar{position:sticky;top:0;background:var(--navy);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:2}
.doc-bar .spacer{flex:1}
.doc-sheet{background:#fff;width:210mm;max-width:100%;margin:18px auto;padding:14mm;box-shadow:0 8px 30px rgba(0,0,0,.35);color:#111;font-size:13px}
.doc-sheet .dh{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid var(--docc,#2563eb);padding-bottom:12px;margin-bottom:14px}
.doc-sheet .dh img{max-height:70px;max-width:180px;object-fit:contain;display:block;margin-bottom:6px}
.doc-sheet .co{font-size:12px;line-height:1.5}
.doc-sheet .co b{font-size:17px;display:block;color:var(--docc,#2563eb)}
.doc-sheet .qn{text-align:right}
.doc-sheet .qn .t{font-size:11px;letter-spacing:.12em;color:#555}
.doc-sheet .qn .n{font-size:24px;font-weight:800;color:var(--docc,#2563eb)}
.doc-sheet h4{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--docc,#2563eb)}
.doc-sheet table{min-width:0;font-size:12.5px}
.doc-sheet th{background:var(--docc,#2563eb);color:#fff;border:0;padding:7px 8px}
.doc-sheet td{padding:7px 8px;border-bottom:1px solid #ddd}
.doc-sheet .box{border:1px solid #ddd;border-radius:6px;padding:8px 10px;line-height:1.55;white-space:pre-line}
.doc-sheet .tots{margin-left:auto;width:260px;margin-top:10px}
.doc-sheet .tots div{display:flex;justify-content:space-between;padding:3px 0}
.doc-sheet .tots .g{border-top:2px solid var(--docc,#2563eb);margin-top:4px;padding-top:6px;font-size:17px;font-weight:800}
.doc-sheet .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.doc-sheet .foot{margin-top:18px;font-size:11px;color:#666;text-align:center;border-top:1px solid #ddd;padding-top:8px}

/* ===== novos recursos: envio de PDF, acompanhamento e mensagens ===== */
.toast{display:flex;align-items:center;gap:12px}
.toast-act{background:#ffffff26;border:0;color:#fff;font-weight:700;border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.toast-act:hover{background:#ffffff40}
.pdf-state{display:flex;align-items:center;gap:8px;background:#f1f5fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px;overflow-wrap:anywhere}
.pdf-state.ok{background:#effaf3;border-color:#bfe6cc;color:#14532d}
.pdf-state.err{background:#fff1f1;border-color:#f5b5b5;color:#8a1c1c}
.pdf-state svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #c7d3e6;border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation-duration:3s}}
.send-opts{display:grid;gap:12px;margin-top:14px}
.send-opt{border:1px solid var(--line);border-radius:10px;padding:12px}
.send-opt .btn{width:100%}
.send-opt p{margin:8px 0 0}
h3.sec{font-size:15px;margin:18px 0 8px;color:var(--navy)}
.linkbox input{font-size:14px;background:#f7f9fc}
.lnk{color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.lnk.danger{color:var(--bad)}
.msgs{display:grid;gap:10px}
.msg{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfcfe}
.msg.cur{border-color:#9db9f2;background:#f3f7ff}
.msg-h{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.msg-t{white-space:pre-line;font-size:14px;color:#334155;margin-bottom:10px;max-height:9.6em;overflow:auto;overflow-wrap:anywhere}
ol.setup{margin:0;padding-left:20px;display:grid;gap:14px}
ol.setup li{padding-left:4px}
code{background:#eef2f8;border-radius:5px;padding:1px 5px;font-size:13px}
.ocard .actions .btn svg{width:16px;height:16px}
.syncline svg{width:16px;height:16px;vertical-align:-3px;fill:none;stroke:var(--ok);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1100px){.item{grid-template-columns:2fr 1fr 1fr 1fr}.item .f-unit,.item .f-total{grid-column:span 2}.item .f-rm{justify-self:end}}
@media (max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .main{margin-left:0}
  .topbar{display:flex}
  .content{padding:14px}
  .two{grid-template-columns:1fr}
  .item{grid-template-columns:1fr 1fr}
  .item .f-prod{grid-column:1/-1}
  .kv{grid-template-columns:1fr}
}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .app,.modal-bg,.toasts,.doc-bar{display:none!important}
  #docOverlay{position:static;display:block!important;background:#fff;overflow:visible}
  .doc-sheet{box-shadow:none;margin:0;width:auto;padding:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo" id="brandLogo"></div><div><span id="brandName">Gráfica</span><small>Gestão de orçamentos e produção</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div class="topbar"><button id="menuBtn" aria-label="Abrir menu"></button><strong id="topTitle">Gráfica</strong></div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<div id="docOverlay">
  <div class="doc-bar">
    <button class="btn" id="docClose">Fechar</button>
    <span class="spacer"></span>
    <button class="btn" id="docWpp">Enviar PDF pelo WhatsApp</button>
    <button class="btn" id="docMail">Enviar por e-mail</button>
    <button class="btn" id="docDownload">Baixar PDF</button>
    <button class="btn primary" id="docPrint">Salvar PDF / Imprimir</button>
  </div>
  <div class="doc-sheet" id="docSheet"></div>
</div>

const brl = n => new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'}).format(Number(n) || 0);
const fnum = (n, d = 2) => new Intl.NumberFormat('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d}).format(Number(n) || 0);
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;

const pad = n => String(n).padStart(2, '0');
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => toISO(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const addBizDays = (s, n) => { const d = parseISO(s); let c = 0; while (c < n) { d.setDate(d.getDate() + 1); if (d.getDay() !== 0 && d.getDay() !== 6) c++; } return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);

/* Lê números digitados em formato brasileiro ("1,5" ou "1.5"). Retorna NaN se inválido. */
function parseNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : NaN;
  let s = String(v ?? '').trim().replace(/\s/g, '').replace(/^R\$/i, '');
  if (!s) return NaN;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  if (!/^-?\d*\.?\d+$/.test(s) && !/^-?\d+\.?$/.test(s)) return NaN;
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
const digits = s => String(s || '').replace(/\D/g, '');
function fmtPhone(s) {
  const d = digits(s);
  if (d.length === 11) return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  if (d.length === 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return s || '';
}

function toast(msg, type = '', action = null) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  const t = document.createElement('span'); t.textContent = msg; el.appendChild(t);
  if (action) {
    const b = document.createElement('button');
    b.className = 'toast-act'; b.type = 'button'; b.textContent = action.label;
    b.addEventListener('click', () => { el.remove(); action.onClick(); });
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), action ? 9000 : type === 'err' ? 6000 : 3200);
}

/* Modais */
function closeModal() { $('#modalRoot').innerHTML = ''; }
function openModal(title, bodyHTML, {wide = false, actions = []} = {}) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-bg"><div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <header><h2>${esc(title)}</h2><button class="btn icon" data-close aria-label="Fechar">${ico('x')}</button></header>
    <div class="body">${bodyHTML}</div>
    <footer></footer></div></div>`;
  const foot = $('footer', root);
  actions.forEach(a => {
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls || '');
    b.textContent = a.label;
    b.addEventListener('click', async () => { const r = await a.onClick?.(root); if (r !== false) closeModal(); });
    foot.appendChild(b);
  });
  $('[data-close]', root).addEventListener('click', closeModal);
  $('.modal-bg', root).addEventListener('mousedown', e => { if (e.target.classList.contains('modal-bg')) closeModal(); });
  return root;
}
function confirmBox(msg, okLabel = 'Confirmar', danger = false, title = 'Confirmação') {
  return new Promise(res => {
    openModal(title, `<p style="margin:0">${msg}</p>`, {actions: [
      {label: 'Cancelar', onClick: () => res(false)},
      {label: okLabel, cls: danger ? 'danger solid' : 'primary', onClick: () => res(true)}
    ]});
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDoc(); } });

const Repo = {
  load() {
    let raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); }
    catch (e) { storageOK = false; raw = memStore[STORAGE_KEY] || null; }
    let data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { data = null; }
    if (!data || typeof data !== 'object') {
      data = {version: 1, settings: defaultSettings(), products: seedProducts(), clients: [], quotes: [], orders: [], counters: {quote: 0, order: 0}};
      DB = data; this.save();
    }
    data.settings = Object.assign(defaultSettings(), data.settings || {});
    if (!data.settings.logo && !data.settings.logoRemoved) data.settings.logo = DEFAULT_LOGO;
    data.settings.messages = Object.assign(defaultMessages(), data.settings.messages || {});
    data.settings.tracking = Object.assign(defaultTracking(), data.settings.tracking || {});
    ['products', 'clients', 'quotes', 'orders'].forEach(k => { if (!Array.isArray(data[k])) data[k] = []; });
    data.counters = Object.assign({quote: 0, order: 0}, data.counters || {});
    DB = data;
    return DB;
  },
  save() {
    const raw = JSON.stringify(DB);
    try { localStorage.setItem(STORAGE_KEY, raw); }
    catch (e) { storageOK = false; memStore[STORAGE_KEY] = raw; toast('Não foi possível gravar no navegador. Exporte um backup em Configurações.', 'err'); }
  },
  list(col) { return DB[col]; },
  get(col, id) { return DB[col].find(x => x.id === id) || null; },
  upsert(col, obj) {
    const i = DB[col].findIndex(x => x.id === obj.id);
    if (i >= 0) DB[col][i] = obj; else DB[col].push(obj);
    this.save();
    if (col === 'orders') Track.queue(obj);   // mantém a página do cliente atualizada
    return obj;
  },
  remove(col, id) { DB[col] = DB[col].filter(x => x.id !== id); this.save(); },
  nextNumber(kind) {
    DB.counters[kind] = (DB.counters[kind] || 0) + 1;
    this.save();
    return (kind === 'quote' ? 'ORC-' : 'PED-') + String(DB.counters[kind]).padStart(4, '0');
  },
  peekNumber(kind) { return (kind === 'quote' ? 'ORC-' : 'PED-') + String((DB.counters[kind] || 0) + 1).padStart(4, '0'); },
  settings() { return DB.settings; },
  saveSettings(s) { DB.settings = s; this.save(); if (Track.connected()) Track.queueBrand(); },
  exportAll() { return JSON.stringify(DB, null, 2); },
  importAll(json) {
    const d = JSON.parse(json);
    if (!d || !Array.isArray(d.products) || !Array.isArray(d.quotes) || !Array.isArray(d.orders)) throw new Error('Arquivo de backup inválido.');
    DB = d; this.load(); this.save();
    Track.prepare(); if (Track.connected()) Track.queueAll();
  },
  reset() { try { localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(DRAFT_KEY); } catch (e) {} delete memStore[STORAGE_KEY]; this.load(); Track.prepare(); }
};

/* ---------- 3) REGRAS DE CÁLCULO ---------- */
const BILLING = {
  fixo:    {label: 'Preço fixo',  unit: 'un'},
  unidade: {label: 'Por unidade', unit: 'un'},
  pacote:  {label: 'Por pacote',  unit: 'pacote'},
  m2:      {label: 'Por m²',      unit: 'm²'}
};

/* Calcula uma linha do orçamento. Nunca lança erro: devolve {ok, err, area, unit, total, minApplied}. */
function calcLine(item) {
  const out = {ok: false, err: '', area: 0, unit: 0, total: 0, minApplied: false};
  const qty = parseNum(item.qty);
  if (!(qty >= 1) || !Number.isInteger(qty)) { out.err = 'Informe a quantidade (número inteiro, mínimo 1).'; return out; }
  if (qty > 1000000) { out.err = 'Quantidade muito alta. Confira o valor digitado.'; return out; }
  const price = Number(item.price) || 0;
  const min = Number(item.minPrice) || 0;
  let unit, total;
  if (item.type === 'm2') {
    const w = parseNum(item.width), h = parseNum(item.height);
    if (!(w > 0) || !(h > 0)) { out.err = 'Informe largura e altura em metros (maiores que zero).'; return out; }
    if (w > 100 || h > 100) { out.err = 'Medida acima de 100 m. Confira se digitou em metros (ex.: 1,5).'; return out; }
    out.area = w * h;
    unit = round2(out.area * price);
    if (min > 0 && item.minMode !== 'order' && unit < min) { unit = round2(min); out.minApplied = true; }
    total = round2(unit * qty);
    if (min > 0 && item.minMode === 'order' && total < min) { total = round2(min); unit = round2(total / qty); out.minApplied = true; }
  } else {
    unit = round2(price);
    if (min > 0 && item.minMode !== 'order' && unit < min) { unit = round2(min); out.minApplied = true; }
    total = round2(unit * qty);
    if (min > 0 && item.minMode === 'order' && total < min) { total = round2(min); unit = round2(total / qty); out.minApplied = true; }
  }
  out.ok = true; out.unit = unit; out.total = total;
  return out;
}

/* Totais do orçamento: subtotal, desconto (percentual ou R$) e total. */
function calcTotals(lineTotals, discountType, discountValue) {
  const subtotal = round2(lineTotals.reduce((a, b) => a + (Number(b) || 0), 0));
  const raw = String(discountValue ?? '').trim();
  let v = raw === '' ? 0 : parseNum(raw), err = '';
  if (isNaN(v) || v < 0) { err = 'Desconto inválido.'; v = 0; }
  let discount = 0;
  if (discountType === 'pct') {
    if (v > 100) { err = 'O desconto percentual não pode passar de 100%.'; v = 0; }
    discount = round2(subtotal * v / 100);
  } else {
    discount = round2(v);
    if (discount > subtotal) { err = 'O desconto não pode ser maior que o subtotal.'; discount = 0; }
  }
  return {subtotal, discount, total: round2(subtotal - discount), err};
}

const STATUS = [
  {k: 'aguardando', label: 'Aguardando produção', color: '#64748b'},
  {k: 'producao',   label: 'Em produção',          color: '#2563eb'},
  {k: 'acabamento', label: 'Em acabamento',        color: '#7c3aed'},
  {k: 'retirada',   label: 'Aguardando retirada ou entrega', color: '#d97706'},
  {k: 'concluido',  label: 'Concluído',            color: '#16a34a'}
];
const stLabel = k => (STATUS.find(s => s.k === k) || {label: k}).label;
const NEAR_DAYS = 2;

function effectiveQuoteStatus(q) {
  if (q.status === 'pendente' && q.validadeDias > 0 && addDays(q.createdAt, q.validadeDias) < todayISO()) return 'expirado';
  return q.status;
}
const quoteLabel = s => ({pendente: 'Pendente', aprovado: 'Aprovado', recusado: 'Recusado', expirado: 'Expirado'}[s] || s);
function deadlineState(o) {
  if (o.status === 'concluido' || !o.deadline) return 'ok';
  const d = diffDays(o.deadline, todayISO());
  return d < 0 ? 'late' : d <= NEAR_DAYS ? 'near' : 'ok';
}
function deadlineText(o) {
  const d = diffDays(o.deadline, todayISO());
  if (d < 0) return `Atrasado há ${-d} dia${d === -1 ? '' : 's'}`;
  if (d === 0) return 'Entrega hoje';
  if (d === 1) return 'Entrega amanhã';
  return `Faltam ${d} dias`;
}

function snapshotFromProduct(p) {
  return {pid: p.id, name: p.name, category: p.category, type: p.billing, unitLabel: p.unitLabel || BILLING[p.billing].unit,
          price: Number(p.price), minPrice: Number(p.minPrice) || 0, minMode: p.minMode || 'unit', desc: p.description || '', prazo: Number(p.prazo) || 0};
}

/* Converte orçamento aprovado em pedido de produção (sem redigitar nada). */
function createOrderFromQuote(quoteId, {deadline, responsible = '', notes = ''} = {}) {
  const q = Repo.get('quotes', quoteId);
  if (!q) throw new Error('Orçamento não encontrado.');
  if (q.orderId && Repo.get('orders', q.orderId)) throw new Error('Este orçamento já foi enviado para a produção.');
  const today = todayISO();
  const order = {
    id: uid(), number: Repo.nextNumber('order'), quoteId: q.id, quoteNumber: q.number,
    client: JSON.parse(JSON.stringify(q.client)),
    items: JSON.parse(JSON.stringify(q.items)),
    total: q.total, entryDate: today,
    deadline: deadline || addBizDays(today, q.prazoDias || 0),
    prazoPrevisto: deadline || addBizDays(today, q.prazoDias || 0),
    responsible, notes, status: 'aguardando', completedAt: '', trackToken: randomToken(24),
    log: [{at: new Date().toISOString(), from: '', to: 'aguardando'}]
  };
  Repo.upsert('orders', order);
  q.status = 'aprovado'; q.approvedAt = today; q.orderId = order.id;
  Repo.upsert('quotes', q);
  return order;
}

function setOrderStatus(orderId, status) {
  const o = Repo.get('orders', orderId);
  if (!o || !STATUS.some(s => s.k === status) || o.status === status) return o;
  o.log.push({at: new Date().toISOString(), from: o.status, to: status});
  o.status = status;
  o.completedAt = status === 'concluido' ? todayISO() : '';
  Repo.upsert('orders', o);
  return o;
}

function upsertClient(c) {
  const name = (c.name || '').trim();
  if (!name) return;
  const ex = DB.clients.find(x => x.name.toLowerCase() === name.toLowerCase());
  if (ex) { if (c.phone) ex.phone = c.phone; if (c.email) ex.email = c.email; Repo.upsert('clients', ex); }
  else Repo.upsert('clients', {id: uid(), name, phone: c.phone || '', email: c.email || ''});
}

function newDraft() {

    discountType: 'pct', discountValue: '', prazoDias: '', prazoManual: false, validadeDias: s.defaultValidity, payment: s.defaultPayment, notes: s.defaultNotes};

function loadStoredDraft() {
  try { const raw = localStorage.getItem(DRAFT_KEY); if (raw) { const d = JSON.parse(raw); if (d && d.items && d.client) return d; } } catch (e) {}
  return null;
}
function persistDraft() {
  if (!draft) return;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft, (k, v) => k.startsWith('_') ? undefined : v)); } catch (e) {}
}
function clearStoredDraft() { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }

function computeDraft() {
  draft.items.forEach(it => {
    const r = it.pid ? calcLine(it) : {ok: false, err: 'Selecione um produto ou serviço.', area: 0, unit: 0, total: 0, minApplied: false};
    it._r = r; it.unit = r.unit; it.total = r.total; it.area = r.area;
  });
  draft._t = calcTotals(draft.items.map(i => i.total || 0), draft.discountType, draft.discountValue);
  if (!draft.prazoManual) draft.prazoDias = String(Math.max(0, ...draft.items.map(i => Number(i.prazo) || 0)));
}

function productOptions(selPid) {
  const cats = {};
  DB.products.forEach(p => (cats[p.category || 'Sem categoria'] = cats[p.category || 'Sem categoria'] || []).push(p));

  Object.keys(cats).sort().forEach(c => {
    html += `<optgroup label="${esc(c)}">` + cats[c].sort((a, b) => a.name.localeCompare(b.name)).map(p =>
      `<option value="${esc(p.id)}" ${p.id === selPid ? 'selected' : ''}>${esc(p.name)} — ${brl(p.price)}/${esc(p.unitLabel || BILLING[p.billing].unit)}</option>`).join('') + '</optgroup>';

}

function refreshDraftUI(showErrors = false) {
  computeDraft();
  $$('#items .item').forEach(row => {
    const it = draft.items[Number(row.dataset.i)]; if (!it) return;
    const r = it._r;
    $('[data-o=unit]', row).textContent = r.ok ? brl(r.unit) : '—';
    $('[data-o=total]', row).textContent = r.ok ? brl(r.total) : '—';
    const hint = $('[data-o=hint]', row);
    if (!it.pid) hint.innerHTML = '', hint.className = 'hint';
    else if (!r.ok) { const touched = showErrors || it.type !== 'm2' || it.width || it.height; hint.textContent = touched ? r.err : (it.desc || ''); hint.className = 'hint' + (touched ? ' err' : ''); }
    else {
      const parts = [];
      if (it.type === 'm2') parts.push(`Área: <b>${fnum(r.area)} m²</b> × ${brl(it.price)}/m² = <b>${brl(round2(r.area * it.price))}</b> por unidade`);
      else parts.push(`${brl(it.price)} por ${esc(it.unitLabel)}`);
      if (r.minApplied) parts.push(`<b>preço mínimo aplicado</b> (${brl(it.minPrice)} ${it.minMode === 'order' ? 'por pedido' : 'por unidade'})`);
      hint.innerHTML = parts.join(' · ') + (it.desc ? `<br>${esc(it.desc)}` : ''); hint.className = 'hint';
    }
    $$('input[data-f=width],input[data-f=height],input[data-f=qty]', row).forEach(inp => {
      const bad = showErrors && !r.ok && it.pid && !inp.disabled; inp.classList.toggle('invalid', bad);
    });
    $('select[data-f=pid]', row).classList.toggle('invalid', showErrors && !it.pid);
  });
  const t = draft._t;
  $('#sumTotal').textContent = brl(t.total);
  $('#sumLeft').innerHTML = `Subtotal ${brl(t.subtotal)} · Desconto ${brl(t.discount)}` + (t.err ? `<br><span style="color:var(--bad)">${esc(t.err)}</span>` : '');
  const pz = $('[data-d=prazoDias]'); if (pz && !draft.prazoManual) pz.value = draft.prazoDias;
  const ph = $('#prazoHint'); if (ph) ph.textContent = draft.prazoManual ? 'Ajustado manualmente.' : 'Sugerido pelo maior prazo dos produtos.';
  persistDraft();
}

function validateDraft() {
  computeDraft();
  const errs = [], d = draft;
  if (!d.client.name.trim()) errs.push(['[data-c=name]', 'Informe o nome do cliente.']);
  if (d.client.phone.trim()) { const n = digits(d.client.phone).length; if (n < 10 || n > 13) errs.push(['[data-c=phone]', 'Telefone inválido. Use DDD + número.']); }
  if (d.client.email.trim() && !validEmail(d.client.email.trim())) errs.push(['[data-c=email]', 'E-mail inválido.']);
  if (!d.items.length) errs.push([null, 'Adicione ao menos um produto.']);
  d.items.forEach((it, i) => { if (!it._r.ok) errs.push([null, `Item ${i + 1}: ${it._r.err}`]); });
  if (d._t.err) errs.push(['[data-d=discountValue]', d._t.err]);
  const pz = parseNum(d.prazoDias);
  if (isNaN(pz) || pz < 0 || !Number.isInteger(pz)) errs.push(['[data-d=prazoDias]', 'Prazo de produção deve ser um número inteiro de dias úteis.']);
  const vd = parseNum(d.validadeDias);
  if (isNaN(vd) || vd < 1 || !Number.isInteger(vd)) errs.push(['[data-d=validadeDias]', 'Validade deve ser um número inteiro de dias (mínimo 1).']);
  $$('#view [data-c],#view [data-d]').forEach(el => el.classList.remove('invalid'));
  errs.forEach(e => { if (e[0]) $(e[0])?.classList.add('invalid'); });
  const box = $('#errBox');
  if (box) box.innerHTML = errs.length ? `<div class="errbox"><b>Corrija antes de continuar:</b><ul>${errs.map(e => `<li>${esc(e[1])}</li>`).join('')}</ul></div>` : '';
  if (errs.length) { refreshDraftUI(true); box?.scrollIntoView({behavior: 'smooth', block: 'center'}); }
  return errs.length === 0;
}

    items: d.items.map(it => ({pid: it.pid, name: it.name, category: it.category, type: it.type, unitLabel: it.unitLabel, price: it.price,
      minPrice: it.minPrice, minMode: it.minMode, desc: it.desc, prazo: it.prazo, width: it.type === 'm2' ? parseNum(it.width) : 0,
      height: it.type === 'm2' ? parseNum(it.height) : 0, qty: parseNum(it.qty), area: round2(it.area), unit: it.unit, total: it.total})),
    discountType: d.discountType, discountValue: parseNum(d.discountValue) || 0,
    subtotal: d._t.subtotal, discount: d._t.discount, total: d._t.total,
    prazoDias: parseNum(d.prazoDias), validadeDias: parseNum(d.validadeDias), payment: d.payment, notes: d.notes, updatedAt: new Date().toISOString()

function approveQuoteDialog(quoteId, after) {
  const q = Repo.get('quotes', quoteId);
  if (!q) return;
  const team = Repo.settings().team;
  const defDeadline = addBizDays(todayISO(), q.prazoDias || 0);
  const expired = effectiveQuoteStatus(q) === 'expirado';
  openModal(`Aprovar ${q.number} e enviar para produção`, `
    ${expired ? '<div class="warnbar">Este orçamento está vencido. Confirme que o cliente aceita os valores antes de aprovar.</div>' : ''}
    <dl class="kv"><dt>Cliente</dt><dd>${esc(q.client.name)}</dd><dt>Valor total</dt><dd>${brl(q.total)}</dd><dt>Itens</dt><dd>${q.items.length}</dd></dl>
    <div class="fields">
      <div><label>Prazo de entrega *</label><input type="date" id="apDeadline" value="${defDeadline}"></div>
      <div><label>Responsável pela produção</label><select id="apResp"><option value="">— a definir —</option>${team.map(t => `<option>${esc(t)}</option>`).join('')}</select></div>
      <div class="wide"><label>Observações para a produção</label><textarea id="apNotes" placeholder="Ex.: arte aprovada por WhatsApp, entregar até 16h…"></textarea></div>
    </div>`, {actions: [
    {label: 'Cancelar'},
    {label: 'Aprovar e enviar para produção', cls: 'ok', onClick: () => {
      const dl = $('#apDeadline').value;
      if (!dl) { toast('Informe o prazo de entrega.', 'err'); return false; }
      try {
        const o = createOrderFromQuote(quoteId, {deadline: dl, responsible: $('#apResp').value, notes: $('#apNotes').value.trim()});
        toast(`${q.number} aprovado. Pedido ${o.number} na fila de produção.`, 'ok', {label: 'Avisar cliente', onClick: () => notifyDialog(o.id)});
        if (draft && draft.id === quoteId) { draft = null; clearStoredDraft(); }

    }}]});
}

/* Documento do orçamento (visualização + impressão em PDF) */
let docQuote = null;
function buildDocHTML(q) {
  const s = Repo.settings();
  const rows = q.items.map(it => `<tr>

    <td style="text-align:right">${brl(it.unit)}</td>
    <td style="text-align:right"><b>${brl(it.total)}</b></td></tr>`).join('');
  const validUntil = addDays(q.createdAt, q.validadeDias || 0);
  const dis = q.discount > 0 ? `<div><span>Desconto${q.discountType === 'pct' ? ` (${fnum(q.discountValue, q.discountValue % 1 ? 2 : 0)}%)` : ''}</span><span>− ${brl(q.discount)}</span></div>` : '';

    <h4>Cliente</h4>
    <div class="box"><b>${esc(q.client.name)}</b>${q.client.phone ? `\nTelefone/WhatsApp: ${esc(fmtPhone(q.client.phone))}` : ''}${q.client.email ? `\nE-mail: ${esc(q.client.email)}` : ''}</div>
    <h4>Produtos e serviços</h4>
    <table><thead><tr><th>Descrição</th><th>Medidas</th><th style="text-align:center">Qtd.</th><th style="text-align:right">Valor unit.</th><th style="text-align:right">Total</th></tr></thead><tbody>${rows}</tbody></table>

    <div class="cols"><div><h4>Prazo de produção</h4><div class="box">${q.prazoDias} dia${q.prazoDias === 1 ? '' : 's'} útil${q.prazoDias === 1 ? '' : 'eis'} após aprovação do orçamento e da arte${q.prazoDias === 0 ? ' (entrega imediata)' : ''}.</div></div>
    <div><h4>Condições de pagamento</h4><div class="box">${esc(q.payment || '—')}</div></div></div>
    ${q.notes ? `<h4>Observações</h4><div class="box">${esc(q.notes)}</div>` : ''}
    <div class="foot">${esc(s.companyName)} — Obrigado pela preferência! Este orçamento é válido até ${fmtDate(validUntil)}.</div></div>`;

function showDoc(q) {
  docQuote = q;
  $('#docSheet').innerHTML = buildDocHTML(q);
  $('#docOverlay').classList.add('open');
  $('#docOverlay').scrollTop = 0;
}
function closeDoc() { $('#docOverlay').classList.remove('open'); }
function printDoc() {
  const prev = document.title;
  const safe = s => String(s).replace(/[^\p{L}\p{N}\-_ ]/gu, '').trim();
  document.title = `Orçamento ${docQuote.number} - ${safe(docQuote.client.name)}`;
  const restore = () => { document.title = prev; window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  window.print();
}
function quoteSummaryText(q) {
  const s = Repo.settings();
  return `Olá, ${q.client.name}! Segue o orçamento ${q.number} da ${s.companyName}.\n\n` +
    q.items.map(i => `• ${i.name}${i.type === 'm2' ? ` (${fnum(i.width)} × ${fnum(i.height)} m)` : ''} — ${i.qty} un — ${brl(i.total)}`).join('\n') +

}
function sendMail() {
  const q = docQuote; if (!q) return;
  location.href = `mailto:${encodeURIComponent(q.client.email || '')}?subject=${encodeURIComponent(`Orçamento ${q.number} - ${Repo.settings().companyName}`)}&body=${encodeURIComponent(quoteSummaryText(q))}`;

}

  fr.onload = () => {

    img.onload = () => {
      const max = 500, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

    img.onerror = () => toast('Não foi possível ler a imagem.', 'err');
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* ---------- A) PDF DO ORÇAMENTO ---------- */
const PdfMaker = {
  cache: {key: '', blob: null, promise: null},
  fileName(q) {
    const safe = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9\- ]/g, '').trim().replace(/\s+/g, ' ');
    return `Orcamento ${q.number} - ${safe(q.client.name) || 'cliente'}.pdf`;
  },
  keyOf(q) { return q.id + '|' + (q.updatedAt || '') + '|' + JSON.stringify(Repo.settings().color) + '|' + (Repo.settings().logo || '').length; },
  get(q) {
    const k = this.keyOf(q);
    if (this.cache.key === k && (this.cache.blob || this.cache.promise)) return this.cache.blob ? Promise.resolve(this.cache.blob) : this.cache.promise;
    this.cache = {key: k, blob: null, promise: null};
    const p = this.render(q).then(b => { if (this.cache.key === k) this.cache.blob = b; return b; })
      .catch(e => { if (this.cache.key === k) this.cache = {key: '', blob: null, promise: null}; throw e; });
    this.cache.promise = p;
    return p;
  },
  async render(q) {
    if (typeof html2canvas !== 'function') throw new Error('Gerador de PDF indisponível neste navegador.');
    const W = 718;                                   // 190 mm de largura útil (A4 com margens de 10 mm)
    const PAGE_H = W * 277 / 190;                     // 277 mm de altura útil
    const holder = document.createElement('div');
    holder.setAttribute('aria-hidden', 'true');
    holder.style.cssText = `position:absolute;left:-12000px;top:0;width:${W}px;background:#fff`;
    const sheet = document.createElement('div');
    sheet.className = 'doc-sheet';
    sheet.style.cssText = `width:${W}px;max-width:none;margin:0;padding:0;box-shadow:none`;
    sheet.innerHTML = buildDocHTML(q);
    holder.appendChild(sheet);
    document.body.appendChild(holder);
    try {
      await Promise.all($$('img', sheet).map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
      const scale = 2;
      const canvas = await html2canvas(sheet, {scale, backgroundColor: '#ffffff', logging: false, useCORS: true});
      const top0 = sheet.getBoundingClientRect().top;
      const H = sheet.getBoundingClientRect().height;
      /* Pontos onde a página pode ser cortada sem partir uma linha ao meio */
      const cuts = new Set();
      $$('tr, .dh, .box, .tots, .cols, .foot, h4', sheet).forEach(el => {
        const r = el.getBoundingClientRect();
        if (el.tagName !== 'H4') cuts.add(Math.round(r.bottom - top0));   // título nunca fica sozinho no fim da página
        if (el.tagName === 'H4' || el.tagName === 'TR' || el.classList.contains('cols')) cuts.add(Math.floor(r.top - top0) - 2);
      });
      const sorted = [...cuts].filter(c => c > 0 && c < H).sort((a, b) => a - b);
      const slices = [];
      let start = 0;
      while (start < H - 1) {
        const limit = start + PAGE_H;
        let end;
        if (limit >= H) end = H;
        else {
          const ok = sorted.filter(c => c > start + PAGE_H * 0.4 && c <= limit);
          end = ok.length ? ok[ok.length - 1] : limit;
        }
        slices.push([start, end]); start = end;
      }
      const ptPerPx = 538.58 / W;
      const pages = slices.map(([a, b]) => {
        const c = document.createElement('canvas');
        c.width = canvas.width;
        c.height = Math.max(1, Math.round((b - a) * scale));
        const g = c.getContext('2d');
        g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
        g.drawImage(canvas, 0, Math.round(a * scale), c.width, c.height, 0, 0, c.width, c.height);
        const jpeg = Uint8Array.from(atob(c.toDataURL('image/jpeg', 0.9).split(',')[1]), ch => ch.charCodeAt(0));
        const dh = (b - a) * ptPerPx;
        return {jpeg, w: c.width, h: c.height, dw: 538.58, dh, x: 28.35, y: 841.89 - 28.35 - dh};
      });
      return new Blob([this.build(pages)], {type: 'application/pdf'});
    } finally { holder.remove(); }
  },
  /* Monta um PDF simples (uma imagem JPEG por página A4), sem bibliotecas externas */
  build(pages) {
    const enc = new TextEncoder(), parts = [], offs = [];
    let len = 0;
    const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
    const obj = (n, fill) => { offs[n] = len; push(`${n} 0 obj\n`); fill(); push('\nendobj\n'); };
    push('%PDF-1.4\n');
    push(new Uint8Array([37, 226, 227, 207, 211, 10]));
    obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
    obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => `${3 + 3 * i} 0 R`).join(' ')}] /Count ${pages.length} >>`));
    pages.forEach((p, i) => {
      const pn = 3 + 3 * i, cn = pn + 1, im = pn + 2;
      obj(pn, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${cn} 0 R >>`));
      const cs = `q ${p.dw.toFixed(2)} 0 0 ${p.dh.toFixed(2)} ${p.x.toFixed(2)} ${p.y.toFixed(2)} cm /Im${i} Do Q`;
      obj(cn, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
      obj(im, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.jpeg.length} >>\nstream\n`); push(p.jpeg); push('\nendstream'); });
    });
    const size = 3 + 3 * pages.length, xref = len;
    let x = `xref\n0 ${size}\n0000000000 65535 f \n`;
    for (let n = 1; n < size; n++) x += String(offs[n]).padStart(10, '0') + ' 00000 n \n';
    push(x + `trailer\n<< /Size ${size} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    const out = new Uint8Array(len); let o = 0;
    parts.forEach(b => { out.set(b, o); o += b.length; });
    return out;
  }
};

function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(t); t.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (er) {}
    t.remove(); return ok;
  }
}
function waUrl(phone, text) {
  let ph = digits(phone);
  if (ph && ph.length <= 11) ph = '55' + ph;
  return `https://wa.me/${ph}?text=${encodeURIComponent(text)}`;
}
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.share && navigator.canShare({files: [new File(['x'], 't.pdf', {type: 'application/pdf'})]})); }
  catch (e) { return false; }
}
function raiseModal(root) { const bg = $('.modal-bg', root); if (bg) bg.style.zIndex = 260; return root; }

async function downloadQuotePdf() {
  const q = docQuote; if (!q) return;
  const b = $('#docDownload'); if (b) { b.disabled = true; b.textContent = 'Gerando PDF…'; }
  try { const blob = await PdfMaker.get(q); downloadBlob(blob, PdfMaker.fileName(q)); toast('PDF baixado.', 'ok'); }
  catch (e) { toast('Não foi possível gerar o PDF. Use "Salvar PDF / Imprimir".', 'err'); }
  finally { if (b) { b.disabled = false; b.innerHTML = `${ico('pdf')} Baixar PDF`; } }
}

/* Janela "Enviar orçamento pelo WhatsApp" */
function sendWhatsApp() {
  const q = docQuote; if (!q) return;
  const share = canShareFiles();
  const phone = q.client.phone ? fmtPhone(q.client.phone) : '';
  const root = raiseModal(openModal(`Enviar ${q.number} pelo WhatsApp`, `
    <dl class="kv"><dt>Cliente</dt><dd>${esc(q.client.name)}</dd><dt>WhatsApp</dt><dd>${phone ? esc(phone) : '<span class="muted">Sem telefone no orçamento. O WhatsApp vai pedir para escolher o contato.</span>'}</dd></dl>
    <div class="pdf-state" id="wpState"><span class="spin"></span> Preparando o PDF…</div>

    <textarea id="wpText" rows="7">${esc(quoteSummaryText(q))}</textarea>
    <div class="send-opts">
      ${share ? `<div class="send-opt"><button class="btn primary" id="wpShare" disabled>${ico('share')} Compartilhar PDF</button>
        <p class="small muted">Abre o compartilhamento do aparelho com o PDF anexado. Escolha <b>WhatsApp</b> e a conversa de ${esc(q.client.name)}.</p></div>` : ''}
      <div class="send-opt"><button class="btn ${share ? '' : 'primary'}" id="wpOpen" disabled>${ico('wpp')} Baixar PDF e abrir conversa</button>
        <p class="small muted">Baixa o arquivo e abre o WhatsApp já ${phone ? 'no número do cliente' : 'para escolher o contato'}, com a mensagem pronta. Depois é só anexar o PDF baixado${share ? '' : ' (no computador, arraste o arquivo para a conversa)'}.</p></div>
    </div>`, {actions: [{label: 'Fechar'}]}));
  const state = $('#wpState', root);
  let blob = null;
  PdfMaker.get(q).then(b => {
    blob = b;
    if (!state.isConnected) return;
    state.innerHTML = `${ico('done')}<span>PDF pronto: <b>${esc(PdfMaker.fileName(q))}</b> (${Math.max(1, Math.round(b.size / 1024))} KB)</span>`;
    state.classList.add('ok');
    $$('#wpShare, #wpOpen', root).forEach(x => x.disabled = false);
  }).catch(() => {
    if (!state.isConnected) return;
    state.classList.add('err');
    state.textContent = 'Não foi possível gerar o PDF neste navegador. Use "Salvar PDF / Imprimir" e anexe o arquivo manualmente.';
    const o = $('#wpOpen', root); if (o) { o.disabled = false; o.innerHTML = `${ico('wpp')} Abrir conversa com a mensagem`; }
  });
  const text = () => $('#wpText', root).value.trim();
  $('#wpShare', root)?.addEventListener('click', async () => {
    if (!blob) return;
    const file = new File([blob], PdfMaker.fileName(q), {type: 'application/pdf'});
    const msg = text();
    try {
      const p = navigator.share({files: [file], title: `Orçamento ${q.number}`, text: msg});
      copyText(msg).catch(() => {});
      await p;
      toast('Compartilhamento enviado. A mensagem também foi copiada, caso precise colar.', 'ok');
      closeModal();
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      downloadBlob(blob, file.name);
      window.open(waUrl(q.client.phone, msg), '_blank');
      toast('O compartilhamento não abriu. O PDF foi baixado: anexe-o na conversa.', 'err');
    }
  });
  $('#wpOpen', root).addEventListener('click', () => {
    if (blob) downloadBlob(blob, PdfMaker.fileName(q));
    window.open(waUrl(q.client.phone, text()), '_blank');
    toast(blob ? 'PDF baixado. Anexe o arquivo na conversa que abriu.' : 'Anexe o PDF salvo na conversa que abriu.');
  });
}

/* ---------- B) ACOMPANHAMENTO ONLINE ---------- */
function randomToken(bytes = 24) {
  const b = new Uint8Array(bytes); crypto.getRandomValues(b);
  return btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
const PUBLIC_STEP = {aguardando: 'Aguardando produção', producao: 'Em produção', acabamento: 'Em acabamento', retirada: 'Aguardando retirada ou entrega', concluido: 'Finalizado / entregue'};

const Track = {
  timer: null, busy: false, lastError: '', lastOkAt: '',
  cfg() { return Repo.settings().tracking; },
  base() { return String(this.cfg().url || '').trim().replace(/\/+$/, '').replace(/\/rest\/v1$/i, ''); },
  connected() { const c = this.cfg(); return !!(this.base() && c.key && c.secret && c.connectedAt); },
  online() { return this.connected() && !!this.cfg().pageUrl; },
  prepare() {
    const s = Repo.settings();
    if (!Array.isArray(DB.trackPending)) DB.trackPending = [];
    if (!Array.isArray(DB.trackRemove)) DB.trackRemove = [];
    if (!s.tracking.secret) { s.tracking.secret = randomToken(24); Repo.save(); }
  },
  init() {
    this.prepare();
    window.addEventListener('online', () => this.flush());
    setInterval(() => { if (this.hasWork()) this.flush(); }, 60000);
    if (this.hasWork()) setTimeout(() => this.flush(), 1500);
  },
  hasWork() { return DB.trackPending.length || DB.trackRemove.length || DB.trackBrandPending; },
  ensureToken(o) {
    if (o.trackToken) return o.trackToken;
    o.trackToken = randomToken(24);
    Repo.upsert('orders', o);
    return o.trackToken;
  },
  link(o) {
    const page = String(this.cfg().pageUrl || '').trim().replace(/#.*$/, '');
    return page ? `${page}#p=${this.ensureToken(o)}` : '';
  },
  isPending(o) { return DB.trackPending.includes(o.id); },
  /* Chamado sempre que um pedido é gravado (Repo.upsert) */
  queue(o) {
    if (!o || !o.trackToken) return;
    if (!DB.trackPending.includes(o.id)) { DB.trackPending.push(o.id); Repo.save(); }
    this.soon();
  },
  queueBrand() { DB.trackBrandPending = true; Repo.save(); this.soon(); },
  queueAll() {
    DB.orders.forEach(o => { if (o.trackToken && !DB.trackPending.includes(o.id)) DB.trackPending.push(o.id); });
    DB.trackBrandPending = true; Repo.save(); this.soon();
  },
  soon() { clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 400); },
  async rpc(fn, body, cfg) {
    const c = cfg || {url: this.base(), key: this.cfg().key};
    const h = {'Content-Type': 'application/json', apikey: c.key};
    if (String(c.key).startsWith('eyJ')) h.Authorization = 'Bearer ' + c.key;
    let r;
    try { r = await fetch(`${c.url}/rest/v1/rpc/${fn}`, {method: 'POST', headers: h, body: JSON.stringify(body || {})}); }
    catch (e) { const er = new Error('Sem conexão com o banco online. Confira a internet e a URL do projeto.'); er.network = true; throw er; }
    if (!r.ok) {
      let m = ''; try { const j = await r.json(); m = j.message || j.hint || j.error || ''; } catch (e) {}
      let msg = m || `Erro ${r.status}`;
      if (r.status === 404 || /could not find the function/i.test(m)) msg = 'O script de configuração ainda não foi executado no Supabase (ou está desatualizado).';
      else if (r.status === 401 || r.status === 403) msg = /chave/i.test(m) ? 'A chave de publicação não confere. Copie o script de novo e execute-o no Supabase.' : 'Chave do Supabase inválida. Copie a chave "publishable" ou "anon public".';
      else if (/chave de publica/i.test(m)) msg = 'A chave de publicação não confere. Copie o script de novo e execute-o no Supabase.';
      const er = new Error(msg); er.status = r.status; throw er;
    }
    const t = await r.text(); return t ? JSON.parse(t) : null;
  },
  stepDates(o) {
    const order = STATUS.map(s => s.k), dates = {};
    (o.log || []).forEach(l => {
      const i = order.indexOf(l.to); if (i < 0) return;
      order.slice(i + 1).forEach(k => delete dates[k]);
      dates[l.to] = l.at;
    });
    return dates;
  },
  payload(o) {
    return {
      pedido: o.number, cliente: o.client.name, status: o.status,
      prazo: o.deadline, entrada: o.entryDate, concluidoEm: o.completedAt || '',
      etapas: this.stepDates(o),
      itens: o.items.map(i => ({nome: i.name, desc: i.desc || '', medidas: i.type === 'm2' ? `${fnum(i.width)} × ${fnum(i.height)} m` : '', qtd: i.qty}))
    };
  },
  brand() {
    const s = Repo.settings();
    return {nome: s.companyName, telefone: s.phone, endereco: s.address, site: s.site, cor: s.color, logo: s.logo || ''};
  },
  async flush() {
    if (this.busy || !this.connected()) return;
    this.busy = true;
    const key = this.cfg().secret;
    try {
      if (DB.trackBrandPending) {
        await this.rpc('publicar_marca', {p_chave: key, p_dados: this.brand()});
        DB.trackBrandPending = false; Repo.save();
      }
      for (const tk of [...DB.trackRemove]) {
        await this.rpc('remover_pedido', {p_chave: key, p_token: tk});
        DB.trackRemove = DB.trackRemove.filter(x => x !== tk); Repo.save();
      }
      for (const id of [...DB.trackPending]) {
        const o = Repo.get('orders', id);
        if (o && o.trackToken) {
          await this.rpc('publicar_pedido', {p_chave: key, p_token: o.trackToken, p_dados: this.payload(o)});
          o.trackSyncedAt = new Date().toISOString();
        }
        DB.trackPending = DB.trackPending.filter(x => x !== id); Repo.save();
      }
      this.lastError = ''; this.lastOkAt = new Date().toISOString();
    } catch (e) {
      this.lastError = e.message || String(e);
    } finally {
      this.busy = false;
      document.dispatchEvent(new CustomEvent('track-sync'));
    }
  },
  async regenerate(o) {
    if (o.trackToken) DB.trackRemove.push(o.trackToken);
    o.trackToken = randomToken(24);
    Repo.upsert('orders', o);
    this.soon();
  },
  sql(secret) {
    return `-- Acompanhamento de pedidos da gráfica. Execute uma vez no SQL Editor do Supabase (pode executar de novo sem perder nada).
create table if not exists public.acompanhamento (
  token text primary key,
  dados jsonb not null,
  atualizado_em timestamptz not null default now()
);
create table if not exists public.acompanhamento_marca (
  id int primary key default 1 check (id = 1),
  dados jsonb not null default '{}'::jsonb
);
create table if not exists public.acompanhamento_chave (
  id int primary key default 1 check (id = 1),
  chave text not null
);
alter table public.acompanhamento enable row level security;
alter table public.acompanhamento_marca enable row level security;
alter table public.acompanhamento_chave enable row level security;
revoke all on public.acompanhamento, public.acompanhamento_marca, public.acompanhamento_chave from anon, authenticated;

insert into public.acompanhamento_chave (id, chave) values (1, '${secret}')
on conflict (id) do update set chave = excluded.chave;

-- Leitura pública: só devolve o pedido do link informado (nunca a lista de pedidos)
create or replace function public.ver_pedido(p_token text) returns jsonb
language sql stable security definer set search_path = public as $$
  select a.dados || jsonb_build_object('atualizado_em', a.atualizado_em)
  from public.acompanhamento a
  where a.token = p_token and length(p_token) >= 24;
$$;

create or replace function public.ver_marca() returns jsonb
language sql stable security definer set search_path = public as $$
  select coalesce((select dados from public.acompanhamento_marca where id = 1), '{}'::jsonb);
$$;

-- Gravação: só o sistema da gráfica, que conhece a chave de publicação
create or replace function public.testar_chave(p_chave text) returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from public.acompanhamento_chave where id = 1 and chave = p_chave);
$$;

create or replace function public.publicar_pedido(p_chave text, p_token text, p_dados jsonb) returns boolean
language plpgsql security definer set search_path = public as $$
begin
  if not public.testar_chave(p_chave) then raise exception 'chave de publicação inválida' using errcode = '42501'; end if;
  if p_token is null or length(p_token) < 24 then raise exception 'link inválido'; end if;
  insert into public.acompanhamento (token, dados, atualizado_em) values (p_token, p_dados, now())
  on conflict (token) do update set dados = excluded.dados, atualizado_em = now();
  return true;
end $$;

create or replace function public.remover_pedido(p_chave text, p_token text) returns boolean
language plpgsql security definer set search_path = public as $$
begin
  if not public.testar_chave(p_chave) then raise exception 'chave de publicação inválida' using errcode = '42501'; end if;
  delete from public.acompanhamento where token = p_token;
  return true;
end $$;

create or replace function public.publicar_marca(p_chave text, p_dados jsonb) returns boolean
language plpgsql security definer set search_path = public as $$
begin
  if not public.testar_chave(p_chave) then raise exception 'chave de publicação inválida' using errcode = '42501'; end if;
  insert into public.acompanhamento_marca (id, dados) values (1, p_dados)
  on conflict (id) do update set dados = excluded.dados;
  return true;
end $$;

revoke all on function public.ver_pedido(text), public.ver_marca(), public.testar_chave(text),
  public.publicar_pedido(text, text, jsonb), public.remover_pedido(text, text), public.publicar_marca(text, jsonb) from public;
grant execute on function public.ver_pedido(text), public.ver_marca(), public.testar_chave(text),
  public.publicar_pedido(text, text, jsonb), public.remover_pedido(text, text), public.publicar_marca(text, jsonb) to anon, authenticated;
`;
  },
  pageSource() { return new TextDecoder().decode(Uint8Array.from(atob(TRACK_PAGE_B64), c => c.charCodeAt(0))); },
  buildPage(preview) {
    const c = this.cfg();
    const js = v => JSON.stringify(v).replace(/</g, '\\u003c');
    return this.pageSource()
      .replace('"__SUPABASE_URL__"', js(preview ? '' : this.base()))
      .replace('"__SUPABASE_KEY__"', js(preview ? '' : c.key))
      .replace('__PREVIEW__', preview ? js(preview) : 'null');
  },
  previewOrder(o) {
    const html = this.buildPage({pedido: this.payload(o), marca: this.brand()});
    const w = window.open(URL.createObjectURL(new Blob([html], {type: 'text/html'})), '_blank');
    if (!w) toast('O navegador bloqueou a nova aba. Permita pop-ups para ver a prévia.', 'err');
  }
};

const MSG_TYPES = [
  {k: 'link',       label: 'Link de acompanhamento',                 st: ''},
  {k: 'aguardando', label: 'Pedido recebido e aguardando produção',  st: 'aguardando'},
  {k: 'producao',   label: 'Pedido em produção',                     st: 'producao'},
  {k: 'acabamento', label: 'Pedido em acabamento',                   st: 'acabamento'},
  {k: 'retirada',   label: 'Pedido disponível para retirada',        st: 'retirada'},
  {k: 'entrega',    label: 'Pedido finalizado e aguardando entrega', st: 'retirada'},

];
const MSG_VARS = ['cliente', 'pedido', 'produtos', 'prazo', 'link', 'grafica', 'endereco'];
function fillTemplate(tpl, vars) {
  return String(tpl || '').split('\n')
    .filter(line => [...line.matchAll(/\{(\w+)\}/g)].every(m => !MSG_VARS.includes(m[1]) || String(vars[m[1]] || '').trim()))
    .map(line => line.replace(/\{(\w+)\}/g, (all, k) => MSG_VARS.includes(k) ? vars[k] : all))
    .join('\n').replace(/\n{3,}/g, '\n\n').trim();
}
function orderVars(o) {
  const s = Repo.settings();
  return {
    cliente: String(o.client.name || '').trim().split(/\s+/)[0] || o.client.name,
    pedido: o.number,
    produtos: o.items.map(i => i.name).join(', '),
    prazo: fmtDate(o.deadline),
    link: Track.online() ? Track.link(o) : '',

  };
}
function orderMessage(o, k) { return fillTemplate(Repo.settings().messages[k], orderVars(o)); }

/* Janela "Avisar cliente" (link de acompanhamento + mensagens por etapa) */
function notifyDialog(id) {
  const o = Repo.get('orders', id); if (!o) return;

    <h3 class="sec">Link de acompanhamento</h3>
    ${online ? `
      <div class="linkbox"><input id="ntLink" readonly value="${esc(link)}" aria-label="Link de acompanhamento"></div>
      <div class="row" style="margin-top:8px">
        <button class="btn" id="ntCopy">${ico('copy')} Copiar link de acompanhamento</button>
        <button class="btn primary" data-msg="link">${ico('wpp')} Enviar acompanhamento pelo WhatsApp</button>
      </div>
      <div class="small muted syncline" id="ntSync" style="margin-top:8px"></div>
      <div class="row small" style="margin-top:6px"><a class="lnk" id="ntPrev">Ver como o cliente vê</a><a class="lnk" id="ntOpen" href="${esc(link)}" target="_blank" rel="noopener">Abrir página publicada</a><a class="lnk danger" id="ntRegen">Gerar novo link</a></div>`
    : `<div class="warnbar">O acompanhamento online ainda não está ativado. As mensagens abaixo funcionam normalmente, só que sem o link do pedido.
        <div class="row" style="margin-top:8px"><button class="btn sm" id="ntCfg">Ativar em Configurações</button><a class="lnk" id="ntPrev">Ver como o cliente verá a página</a></div></div>`}
    <h3 class="sec">Mensagens prontas</h3>
    <p class="small muted" style="margin-top:-4px">O botão abre o WhatsApp com o texto pronto. Confira e toque em enviar.</p>
    <div class="msgs">${suggested.map(m => msgCard(m, true)).join('')}${others.map(m => msgCard(m, false)).join('')}</div>`, {wide: true, actions: [{label: 'Fechar'}]});
  const box = $('.modal', root), syncEl = $('#ntSync', root);
  const syncLine = () => {
    const el = syncEl; if (!el || !el.isConnected) { document.removeEventListener('track-sync', syncLine); return; }
    const cur = Repo.get('orders', id);
    if (Track.isPending(cur)) el.innerHTML = Track.lastError ? `<span style="color:var(--bad)">Página do cliente ainda não atualizada: ${esc(Track.lastError)}</span> <a class="lnk" id="ntRetry">Tentar de novo</a>` : 'Atualizando a página do cliente…';
    else el.innerHTML = `${ico('done')} Página do cliente atualizada${cur.trackSyncedAt ? ' às ' + new Date(cur.trackSyncedAt).toLocaleTimeString('pt-BR', {hour: '2-digit', minute: '2-digit'}) : ''}.`;
    $('#ntRetry', el)?.addEventListener('click', () => Track.flush());
  };
  if (online) { syncLine(); document.addEventListener('track-sync', syncLine); }
  box.addEventListener('click', async e => {
    const m = e.target.closest('[data-msg]');
    if (m) { window.open(waUrl(o.client.phone, orderMessage(o, m.dataset.msg)), '_blank'); return; }
    const c = e.target.closest('[data-copy-msg]');
    if (c) { toast(await copyText(orderMessage(o, c.dataset.copyMsg)) ? 'Mensagem copiada.' : 'Não foi possível copiar.', 'ok'); return; }
    if (e.target.closest('#ntCopy')) { toast(await copyText(link) ? 'Link copiado.' : 'Não foi possível copiar. Selecione o link e copie.', 'ok'); return; }
    if (e.target.closest('#ntPrev')) { Track.previewOrder(o); return; }
    if (e.target.closest('#ntCfg')) { closeModal(); UI.scrollTo = 'trackCard'; go('config'); return; }
    if (e.target.closest('#ntRegen')) {
      if (await confirmBox(`O link atual de <b>${esc(o.number)}</b> vai parar de funcionar e um novo será criado. Use isso se o link foi enviado para a pessoa errada.`, 'Gerar novo link', true, 'Gerar novo link')) {
        await Track.regenerate(o); toast('Novo link criado. Envie o novo link ao cliente.', 'ok'); notifyDialog(id);
      } else notifyDialog(id);
    }
  });
}

async function trackConnectFromForm() {
  let url = $('#tkUrl').value.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/i, '');
  const key = $('#tkKey').value.trim();
  if (!/^https:\/\/[^\s/]+$/i.test(url)) { $('#tkUrl').classList.add('invalid'); toast('Cole a URL do projeto, no formato https://xxxx.supabase.co', 'err'); return; }
  if (key.length < 20) { $('#tkKey').classList.add('invalid'); toast('Cole a chave publishable (ou anon public) do projeto.', 'err'); return; }
  const s = Repo.settings();
  try {
    const ok = await Track.rpc('testar_chave', {p_chave: s.tracking.secret}, {url, key});
    if (ok !== true) throw new Error('A chave de publicação não confere. Copie o script de novo e execute-o no Supabase.');
  } catch (e) { toast(e.message, 'err'); return; }
  s.tracking = Object.assign({}, s.tracking, {url, key, connectedAt: new Date().toISOString()});
  Repo.saveSettings(s);
  Track.queueAll();
  toast('Conexão funcionando. Agora baixe e publique a página do cliente.', 'ok');
  UI.scrollTo = 'trackCard'; VIEWS.config();
}
function trackSavePage() {
  const v = $('#tkPage').value.trim();
  if (v && !/^https:\/\/\S+$/i.test(v)) { $('#tkPage').classList.add('invalid'); toast('O endereço precisa começar com https://', 'err'); return; }
  const s = Repo.settings();
  s.tracking = Object.assign({}, s.tracking, {pageUrl: v.replace(/#.*$/, '')});
  Repo.save();
  toast(v ? 'Endereço salvo. Os pedidos já podem ser acompanhados pelo link.' : 'Endereço removido.', 'ok');
  UI.scrollTo = 'trackCard'; VIEWS.config();

document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { go(nav.dataset.nav); return; }
  const kpi = e.target.closest('[data-kpi]');
  if (kpi) {
    const v = kpi.dataset.kpi, f = kpi.dataset.filter;
    if (v === 'historico') { UI.hist = {q: '', status: f, from: '', to: ''}; }
    if (v === 'fila') { UI.queue.status = f; UI.queue.q = ''; }
    go(v); return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.tagName === 'SELECT') return;
  const act = b.dataset.act, id = b.dataset.id;
  switch (act) {
    case 'new-quote': draft = newDraft(); clearStoredDraft(); go('orcamentos'); break;
    case 'reset-draft': draft = newDraft(); clearStoredDraft(); VIEWS.orcamentos(); break;
    case 'add-item': draft.items.push(blankItem()); renderItems(); refreshDraftUI(); break;
    case 'rm-item': {
      const i = Number(b.closest('.item').dataset.i);
      if (draft.items.length === 1) draft.items = [blankItem()]; else draft.items.splice(i, 1);
      renderItems(); refreshDraftUI(); break;
    }
    case 'save-quote': if (validateDraft()) { const q = saveDraftQuote(); toast(`Orçamento ${q.number} salvo.`, 'ok'); persistDraft(); clearStoredDraft(); renderShell(); } break;
    case 'quote-pdf': if (validateDraft()) { const q = saveDraftQuote(); renderShell(); showDoc(q); } break;
    case 'save-approve': if (validateDraft()) {
      const prev = draft.id && Repo.get('quotes', draft.id);
      if (prev && prev.orderId) { toast('Este orçamento já foi enviado para a produção.', 'err'); break; }
      const q = saveDraftQuote(); approveQuoteDialog(q.id);
    } break;
    case 'view-quote': showDoc(Repo.get('quotes', id)); break;
    case 'approve-quote': approveQuoteDialog(id, () => go('fila')); break;
    case 'edit-quote': {
      const q = Repo.get('quotes', id);
      draft = {id: q.id, number: q.number, status: q.status, createdAt: q.createdAt, client: {...q.client},
        items: q.items.map(i => ({...i, qty: String(i.qty), width: i.type === 'm2' ? String(i.width).replace('.', ',') : '', height: i.type === 'm2' ? String(i.height).replace('.', ',') : ''})),
        discountType: q.discountType, discountValue: q.discountValue ? String(q.discountValue).replace('.', ',') : '', prazoDias: String(q.prazoDias), prazoManual: true,
        validadeDias: String(q.validadeDias), payment: q.payment, notes: q.notes};
      go('orcamentos'); break;
    }
    case 'dup-quote': {
      const q = Repo.get('quotes', id); const d = newDraft();
      d.client = {...q.client}; d.discountType = q.discountType; d.discountValue = q.discountValue ? String(q.discountValue).replace('.', ',') : '';
      d.payment = q.payment; d.notes = q.notes;
      d.items = q.items.map(i => { const p = Repo.get('products', i.pid); return {...(p ? snapshotFromProduct(p) : i), qty: String(i.qty), width: i.type === 'm2' ? String(i.width).replace('.', ',') : '', height: i.type === 'm2' ? String(i.height).replace('.', ',') : ''}; });
      draft = d; toast('Orçamento duplicado com os preços atuais do catálogo.'); go('orcamentos'); break;
    }
    case 'refuse-quote': { const q = Repo.get('quotes', id); q.status = 'recusado'; Repo.upsert('quotes', q); toast(`${q.number} marcado como recusado.`); VIEWS.historico(); break; }
    case 'reopen-quote': { const q = Repo.get('quotes', id); q.status = 'pendente'; Repo.upsert('quotes', q); toast(`${q.number} voltou para pendente.`); VIEWS.historico(); break; }
    case 'del-quote': {
      const q = Repo.get('quotes', id);
      if (await confirmBox(`Excluir o orçamento <b>${esc(q.number)}</b> de ${esc(q.client.name)}? Esta ação não pode ser desfeita.`, 'Excluir', true)) { Repo.remove('quotes', id); toast('Orçamento excluído.'); VIEWS.historico(); renderShell(); }
      break;
    }
    case 'new-product': productForm(null); break;
    case 'edit-product': productForm(Repo.get('products', id)); break;
    case 'del-product': {
      const p = Repo.get('products', id);
      if (await confirmBox(`Excluir <b>${esc(p.name)}</b> do catálogo? Orçamentos e pedidos já emitidos não são afetados.`, 'Excluir', true)) { Repo.remove('products', id); toast('Produto excluído.'); VIEWS.produtos(); }
      break;
    }
    case 'bulk-price': bulkPriceDialog(); break;
    case 'order-detail': orderDetail(id); break;
    case 'advance': {
      const o = Repo.get('orders', id), nx = STATUS[STATUS.findIndex(s => s.k === o.status) + 1];
      if (nx) { setOrderStatus(id, nx.k); toast(`${o.number}: ${nx.label}.`, nx.k === 'concluido' ? 'ok' : '', {label: 'Avisar cliente', onClick: () => notifyDialog(id)}); go(UI.view); }
      break;
    }
    case 'reopen-order': reopenOrderDialog(id); break;
    case 'notify': notifyDialog(id); break;
    case 'copy-sql': toast(await copyText(Track.sql(Repo.settings().tracking.secret)) ? 'Script copiado. Cole no SQL Editor do Supabase e clique em Run.' : 'Não foi possível copiar.', 'ok'); break;
    case 'track-connect': b.disabled = true; try { await trackConnectFromForm(); } finally { b.disabled = false; } break;
    case 'track-page': downloadBlob(new Blob([Track.buildPage(null)], {type: 'text/html'}), 'acompanhamento.html'); toast('Página baixada: acompanhamento.html. Publique esse arquivo e cole o endereço abaixo.', 'ok'); break;
    case 'track-save-page': trackSavePage(); break;
    case 'reset-msgs':
      if (await confirmBox('Voltar todas as mensagens para o texto padrão?', 'Restaurar')) { const s = Object.assign({}, Repo.settings(), {messages: defaultMessages()}); Repo.saveSettings(s); toast('Mensagens restauradas.', 'ok'); VIEWS.config(); }
      break;
    case 'save-settings': saveSettingsFromForm(); break;
    case 'rm-logo': { const s = Object.assign({}, Repo.settings(), {logo: '', logoRemoved: true}); Repo.saveSettings(s); renderShell(); VIEWS.config(); break; }
    case 'export': {
      const blob = new Blob([Repo.exportAll()], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `backup-grafica-${todayISO()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      break;
    }
    case 'reset-all':
      if (await confirmBox('Apagar <b>todos</b> os orçamentos, pedidos, produtos e configurações? Exporte um backup antes. Esta ação não pode ser desfeita.', 'Apagar tudo', true)) { Repo.reset(); draft = null; toast('Dados apagados.'); go('dashboard'); }
      break;
  }
});

document.addEventListener('input', e => {
  const el = e.target, id = el.id;
  if (el.closest('#view')) {
    if (id === 'pSearch') { UI.prod.q = el.value; renderProductList(); return; }
    if (id === 'hSearch') { UI.hist.q = el.value; renderHistoryList(); return; }
    if (id === 'qSearch') { UI.queue.q = el.value; renderQueueBoard(); return; }
    if (id === 'dSearch') { UI.done.q = el.value; renderDoneList(); return; }
    if (UI.view !== 'orcamentos' || !draft) return;
    el.classList.remove('invalid');
    if (el.dataset.c) {
      draft.client[el.dataset.c] = el.value;
      if (el.dataset.c === 'name') {
        const c = DB.clients.find(x => x.name.toLowerCase() === el.value.trim().toLowerCase());
        if (c) { ['phone', 'email'].forEach(k => { if (!draft.client[k]) { draft.client[k] = c[k] || ''; const i = $(`[data-c=${k}]`); if (i) i.value = c[k] || ''; } }); }
      }
      persistDraft();
    } else if (el.dataset.d) {
      draft[el.dataset.d] = el.value;
      if (el.dataset.d === 'prazoDias') draft.prazoManual = true;
      refreshDraftUI();
    } else if (el.dataset.f && el.dataset.f !== 'pid') {
      draft.items[Number(el.closest('.item').dataset.i)][el.dataset.f] = el.value;
      refreshDraftUI();
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target, id = el.id;
  if (id === 'pCat') { UI.prod.cat = el.value; renderProductList(); return; }
  if (id === 'hStatus') { UI.hist.status = el.value; renderHistoryList(); return; }
  if (id === 'hFrom') { UI.hist.from = el.value; renderHistoryList(); return; }
  if (id === 'hTo') { UI.hist.to = el.value; renderHistoryList(); return; }
  if (id === 'qStatus') { UI.queue.status = el.value; renderQueueBoard(); return; }
  if (id === 'qSort') { UI.queue.sort = el.value; renderQueueBoard(); return; }
  if (id === 'sLogo') { handleLogoFile(el.files[0]); return; }
  if (id === 'importFile') {
    const f = el.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try { JSON.parse(fr.result); } catch (err) { toast('Arquivo inválido.', 'err'); return; }
      if (await confirmBox('Importar este backup substitui todos os dados atuais. Continuar?', 'Importar', true)) {
        try { Repo.importAll(fr.result); draft = null; toast('Backup importado.', 'ok'); go('dashboard'); } catch (err) { toast(err.message, 'err'); }
      }
    };
    fr.readAsText(f); return;
  }
  if (el.dataset.act === 'set-status') {
    const o = Repo.get('orders', el.dataset.id);
    setOrderStatus(el.dataset.id, el.value);
    const id = el.dataset.id;
    toast(`${o.number}: ${stLabel(el.value)}.`, el.value === 'concluido' ? 'ok' : '', {label: 'Avisar cliente', onClick: () => notifyDialog(id)});
    go(UI.view); return;
  }
  if (UI.view === 'orcamentos' && draft && el.closest('#view')) {
    if (el.dataset.f === 'pid') {
      const i = Number(el.closest('.item').dataset.i), it = draft.items[i], p = Repo.get('products', el.value);
      if (p) Object.assign(it, snapshotFromProduct(p));
      else if (!el.value) { draft.items[i] = {...blankItem(), qty: it.qty}; }
      if (p && p.billing !== 'm2') { it.width = ''; it.height = ''; }
      renderItems(); refreshDraftUI();
    } else if (el.dataset.c === 'phone') { el.value = fmtPhone(el.value); draft.client.phone = el.value; persistDraft(); }
    else if (el.dataset.d === 'discountType') { draft.discountType = el.value; refreshDraftUI(); }
  }
});
$('#docClose').addEventListener('click', closeDoc);
$('#docPrint').addEventListener('click', printDoc);
$('#docWpp').addEventListener('click', sendWhatsApp);
$('#docMail').addEventListener('click', sendMail);
$('#docDownload').innerHTML = `${ico('pdf')} Baixar PDF`;
$('#docDownload').addEventListener('click', downloadQuotePdf);
$('#menuBtn').innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${ICONS.menu}</svg>`;
$('#menuBtn').addEventListener('click', () => { $('#sidebar').classList.toggle('open'); $('#scrim').classList.toggle('open'); });
$('#scrim').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('open'); });

/* ---------- INICIALIZAÇÃO ---------- */
Repo.load();
Track.init();
const startView = (location.hash || '').replace('#/', '');
go(NAV.some(n => n.k === startView) ? startView : 'dashboard');

/* Interface de teste (não usada pelas telas) */
window.GraficaApp = {Repo, calcLine, calcTotals, createOrderFromQuote, setOrderStatus, effectiveQuoteStatus, buildDocHTML, snapshotFromProduct, parseNum,
  go, VIEWS, UI, get DB() { return DB; }, get draft() { return draft; }, set draft(v) { draft = v; }, newDraft, validateDraft, saveDraftQuote, computeDraft, showDoc, deadlineState, addBizDays, todayISO, addDays, Track, PdfMaker, notifyDialog, fillTemplate, orderMessage};
</script>
